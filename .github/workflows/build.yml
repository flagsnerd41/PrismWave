name: Build APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'news.json'
      - 'notes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PrismWave
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish release (the app reads this to offer updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PrismWave build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
      - name: Send link to Telegram
        env:
          NOTE: ${{ github.event.head_commit.message }}
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT }}" \
            --data-urlencode "text=PrismWave build ${{ github.run_number }} is ready 🚀
          $NOTE
          https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
